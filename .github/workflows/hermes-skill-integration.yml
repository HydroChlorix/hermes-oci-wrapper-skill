name: Hermes skill install/uninstall integration

on:
  pull_request:
  push:
    branches:
      - main
      - feature
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
  workflow_dispatch:

jobs:
  machine-install-uninstall:
    name: Install/uninstall oci-wrapper on host Hermes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install Hermes CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.hermes/bin" >> "$GITHUB_PATH"

      - name: Show Hermes version
        run: hermes --version

      - name: Run machine integration test
        env:
          RUN_HERMES_MACHINE_INTEGRATION: '1'
          OCI_WRAPPER_SKILL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/SKILL.md
        run: python -m pytest tests/integration/test_hermes_skills_machine.py -q -s -m integration

  docker-install-uninstall:
    name: Install/uninstall oci-wrapper in Hermes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Show Docker version
        run: docker version

      - name: Run Docker integration test
        env:
          RUN_HERMES_DOCKER_INTEGRATION: '1'
          OCI_WRAPPER_SKILL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/SKILL.md
        run: python -m pytest tests/integration/test_hermes_skills_docker.py -q -s -m integration
